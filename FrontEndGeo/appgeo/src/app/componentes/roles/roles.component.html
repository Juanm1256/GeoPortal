<!-- Modal -->
<ng-template #content let-modal>
  <div class="modal-content modal-custom" [ngClass]="{'dark-theme': isDarkMode}">
    <div class="modal-header modal-header-custom">
      <h4 class="modal-title">ROL</h4>
      <button type="button" class="btn-close" aria-label="Cerrar" (click)="modal.dismiss()"></button>
    </div>
    <div class="modal-body">
      <form [formGroup]="form" (ngSubmit)="Guardar()">
        <div class="mb-3">
          <label for="nombre">Nombre del Rol</label>
          <input type="text" class="form-control" id="nombre" formControlName="nombre" placeholder="Ingrese el nombre del rol" />
          <small class="text-danger" *ngIf="getErrorMessage('nombre')">{{ getErrorMessage('nombre') }}</small>
        </div>
        
        <div class="mb-3">
          <label for="permisosrol">Permisos</label>
          <div formArrayName="permisos">
            <div *ngFor="let permiso of permisosList">
              <input type="checkbox" [value]="permiso.idpermiso" (change)="onCheckboxChange($event)" />
              {{ permiso.nombre }}
            </div>
          </div>
          
        </div>
        

        <div class="modal-footer modal-footer-custom">
          <button type="button" class="btn btn-danger btn-rounded" (click)="modal.dismiss()">Cerrar</button>
          <button class="btn btn-success btn-rounded" [disabled]="form.invalid" type="submit">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</ng-template>

<!-- Contenido Principal -->
<div class="content-viewport main-content" [ngClass]="{'dark-theme': isDarkMode}">
  <div class="row py-4 align-items-center header-custom">
    <div class="col-sm-10">
      <h2>ROL</h2>
    </div>
    <div class="col-sm-2 text-end">
      <button type="button" class="btn btn-primary btn-rounded" (click)="Guardarinstruct(content)">
        <i class="mdi mdi-plus-circle"></i> AGREGAR
      </button>
    </div>
  </div>

  <!-- Buscador -->
  <div class="row mb-4 align-items-center search-box">
    <div class="col-md-5">
      <div class="input-group">
        <select class="form-control text-center" [(ngModel)]="criterio">
          <option selected value="nombrerol">Nombre</option>
        </select>
        <input type="text" class="form-control" name="filter" placeholder="Buscar..." [(ngModel)]="search" />
      </div>
    </div>
    <div class="col-md-7 text-end">
      <button type="button" class="btn btn-success btn-rounded" (click)="LimpiarSearch()">
        <i class="mdi mdi-reload"></i> LIMPIAR
      </button>
    </div>
  </div>

  <!-- Spinner de carga -->
  <div *ngIf="isLoading" class="d-flex justify-content-center mt-3">
    <div class="spinner-grow" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <!-- Tabla de Roles -->
  <div class="table-responsive" *ngIf="!isLoading">
    <table class="table table-striped table-custom">
      <thead>
        <tr>
          <th>#</th>
          <th>Nombre</th>
          <th>Fecha de Registro</th>
          <th>Permisos</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let rol of listaRol | filterone:criterio:search | slice: (page-1) * pageSize : (page-1) * pageSize + pageSize; let i = index">
          <td>{{ rol.idrol }}</td>
          <td>{{ rol.nombre }}</td>
          <td>{{ rol.fechareg | date:'dd/MM/yyyy' }}</td>
          <td>
            <ul *ngIf="rol.permisos && rol.permisos.length > 0; else sinPermisos">
              <li *ngFor="let permiso of rol.permisos">{{ permiso }}</li>
            </ul>
            <ng-template #sinPermisos>
              <label>Sin permisos</label>
            </ng-template>
          </td>
          <td [ngClass]="{'text-success': rol.estado === 'Activo', 'text-danger': rol.estado === 'Inactivo'}">
            {{ rol.estado }}
          </td>
          <td>
            <button type="button" (click)="SeleccionarRol(content, rol)" class="btn btn-dark btn-rounded me-2">
              <i class="mdi mdi-lead-pencil"></i> Modificar
            </button>
            <button type="button" (click)="CambiarEstado(rol, 'Inactivo')" 
                    class="btn btn-danger btn-rounded me-2" *ngIf="rol.estado === 'Activo'">
              <i class="mdi mdi-delete"></i> Desactivar
            </button>
            <button type="button" (click)="CambiarEstado(rol, 'Activo')" 
                    class="btn btn-success btn-rounded" *ngIf="rol.estado === 'Inactivo'">
              <i class="mdi mdi-arrow-right-bold-circle"></i> Activar
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Paginación -->
  <div class="float-end mt-3">
    <ngb-pagination [pageSize]="pageSize" [collectionSize]="pagesizee" [(page)]="page" [boundaryLinks]="true"></ngb-pagination>
  </div>
</div>
