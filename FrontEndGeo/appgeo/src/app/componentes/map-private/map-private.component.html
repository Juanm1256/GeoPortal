<div id="map-private" style="width: 100%; height: 100%;" [ngClass]="{'dark-theme': isDarkMode}">
  <div class="map-search-container" (mouseover)="disableMapInteractions()" (mouseleave)="enableMapInteractions()">
    <div class="search-box" [ngClass]="{'expanded': filteredMunicipios.length > 0}">
      <div class="search-input-wrapper">
        <input type="text" [formControl]="searchControl" placeholder="Buscar municipio..." class="search-input">
        <div class="search-icon"><i class="bi bi-search"></i></div>
        <div *ngIf="searchControl.value" class="clear-search-icon" (click)="clearSearch()">
          <i class="bi bi-x-circle-fill"></i>
        </div>
        <div *ngIf="isSearching" class="search-spinner">
          <div class="spinner-border spinner-border-sm" role="status">
            <span class="visually-hidden">Buscando...</span>
          </div>
        </div>
      </div>
      <div class="search-results" *ngIf="filteredMunicipios.length > 0">
        <ul>
          <li *ngFor="let municipio of filteredMunicipios" (click)="selectMunicipio(municipio)"
            (mousedown)="$event.preventDefault()">
            <div class="municipality-item">
              <strong>{{ municipio.mun }}</strong>
              <div class="municipality-details">{{ municipio.prov }}, {{ municipio.dep }}</div>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </div>
  <div class="toolbar" [class.showLayers]="isLayersOpen" [ngClass]="{'dark-theme': isDarkMode}"
    (mouseover)="disableMapInteractions()" (mouseleave)="enableMapInteractions()">
    <button class="tool-btn" (click)="toggleLayers()" title="Capas">
      <i class="bi bi-stack"></i>
    </button>
    <div class="tools" *ngIf="!isLayersOpen" [ngClass]="{'dark-theme': isDarkMode}"
      (mouseover)="disableMapInteractions()" (mouseleave)="enableMapInteractions()">
      <button class="tool-btn" (click)="mapZoomIn()" title="Zoom +">
        <i class="bi bi-plus-lg"></i>
      </button>
      <button class="tool-btn" (click)="mapZoomOut()" title="Zoom -">
        <i class="bi bi-dash-lg"></i>
      </button>
      <button class="tool-btn" (click)="getUserLocation()" title="Ubicación">
        <i class="bi bi-crosshair"></i>
      </button>
      <button class="tool-btn" (click)="toggleBaseMap()" title="Mapa Base">
        <i class="bi bi-globe"></i>
      </button>
      <button class="tool-btn" (click)="addCustomMarker()" title="Marcador">
        <i class="bi bi-geo-alt"></i>
      </button>
      <button class="tool-btn" (click)="captureMap()" title="Capturar">
        <i class="bi bi-camera"></i>
      </button>
      <button class="tool-btn" (click)="resetMapView()" title="Reset">
        <i class="bi bi-arrow-counterclockwise"></i>
      </button>
    </div>
    <div class="layer-panel scrollable-layer-panel" *ngIf="isLayersOpen" (mouseover)="restoreLayerButtonStyles()"
      (wheel)="allowScroll($event)" [ngClass]="{'dark-theme': isDarkMode}">
      <button class="layer-btn" (click)="toggleLayer('cuencas', $event)" data-layer="cuencas">
        <i class="bi bi-layers"></i> <span>Cuencas</span>
      </button>
      <button class="layer-btn" (click)="toggleLayer('mercados', $event)" data-layer="mercados">
        <i class="bi bi-shop"></i> <span>Mercados</span>
      </button>
      <button class="layer-btn" (click)="toggleLayer('capitalesDepartamentales', $event)"
        data-layer="capitalesDepartamentales">
        <i class="bi bi-geo-alt"></i> <span>Capitales Departamentales</span>
      </button>
      <button class="layer-btn" (click)="toggleLayer('limitesDepartamentales', $event)"
        data-layer="limitesDepartamentales">
        <i class="bi bi-map"></i> <span>Límites Departamentales</span>
      </button>
      <button class="layer-btn" (click)="toggleLayer('limitesMunicipales', $event)" data-layer="limitesMunicipales">
        <i class="bi bi-map-fill"></i> <span>Límites Municipales</span>
      </button>
      <button class="layer-btn" (click)="toggleLayer('proveedorAlevines', $event)" data-layer="proveedorAlevines">
        <i class="bi bi-box"></i> <span>Alevines</span>
      </button>
      <button class="layer-btn" (click)="toggleLayer('proveedorAlimentos', $event)" data-layer="proveedorAlimentos">
        <i class="bi bi-basket"></i> <span>Alimentos</span>
      </button>
      <button class="layer-btn" (click)="toggleLayer('proveedorAsistenciaTecnica', $event)"
        data-layer="proveedorAsistenciaTecnica">
        <i class="bi bi-tools"></i> <span>Asistencia Técnica</span>
      </button>
      <button class="layer-btn" (click)="toggleLayer('redCaminos', $event)" data-layer="redCaminos">
        <i class="bi bi-signpost-2"></i> <span>Red de Caminos</span>
      </button>
      <button class="layer-btn" (click)="toggleLayer('redHidrica', $event)" data-layer="redHidrica">
        <i class="bi bi-water"></i> <span>Red Hídrica</span>
      </button>
      <button class="layer-btn" (click)="toggleLayer('Modelo General', $event)" data-layer="Modelo General">
        <i class="bi bi-layers"></i> <span>Mod General Ajustado</span>
      </button>
      <button class="layer-btn" (click)="toggleLayer('Fragmentos_gruesos_suelo', $event)"
        data-layer="Fragmentos_gruesos_suelo">
        <i class="bi bi-layers"></i> <span>Fragmentos Gruesos Suelo</span>
      </button>
      <button class="layer-btn" (click)="toggleLayer('pH_suelo', $event)" data-layer="pH_suelo">
        <i class="bi bi-layers"></i> <span>PH Suelo</span>
      </button>
      <button class="layer-btn" (click)="toggleLayer('Textura_suelo_0', $event)" data-layer="Textura_suelo_0">
        <i class="bi bi-layers"></i> <span>Textura Suelo 0</span>
      </button>
      <button class="layer-btn" (click)="toggleLayer('Textura_suelo_10', $event)" data-layer="Textura_suelo_10">
        <i class="bi bi-layers"></i> <span>Textura Suelo 10</span>
      </button>
      <button class="layer-btn" (click)="toggleLayer('Textura_suelo_30', $event)" data-layer="Textura_suelo_30">
        <i class="bi bi-layers"></i> <span>Textura Suelo 30</span>
      </button>
      <button class="layer-btn" (click)="toggleLayer('Textura_suelo_60', $event)" data-layer="Textura_suelo_60">
        <i class="bi bi-layers"></i> <span>Textura Suelo 60</span>
      </button>
      <button class="layer-btn" (click)="toggleLayer('Textura_suelo_100', $event)" data-layer="Textura_suelo_100">
        <i class="bi bi-layers"></i> <span>Textura Suelo 100</span>
      </button>
      <button class="layer-btn" (click)="toggleLayer('Textura_suelo_200', $event)" data-layer="Textura_suelo_200">
        <i class="bi bi-layers"></i> <span>Textura Suelo 200</span>
      </button>
      <button class="layer-btn" (click)="toggleLayer('Cobertura_uso_suelo', $event)" data-layer="Cobertura_uso_suelo">
        <i class="bi bi-layers"></i> <span>Cobertura uso Suelo</span>
      </button>
      <button class="layer-btn" (click)="toggleLayer('Textura', $event)" data-layer="Textura">
        <i class="bi bi-layers"></i> <span>Textura</span>
      </button>
      <button class="layer-btn" (click)="toggleLayer('Precipitacion', $event)" data-layer="Precipitacion">
        <i class="bi bi-layers"></i> <span>Precipitacion</span>
      </button>
      <button class="layer-btn" (click)="toggleLayer('Temperaturamedia', $event)" data-layer="Temperaturamedia">
        <i class="bi bi-layers"></i> <span>Temperatura Media</span>
      </button>
      <button class="layer-btn" (click)="toggleLayer('estanques', $event)" data-layer="estanques">
        <i class="bi bi-layers"></i> <span>Estanque</span>
      </button>
      <button class="layer-btn" (click)="toggleLayer('Pendiente', $event)" data-layer="Pendiente">
        <i class="bi bi-layers"></i> <span>Pendiente</span>
      </button>
    </div>
  </div>
</div>
<div class="modal fade draggable" id="datosModal" [class.show]="showModal"
  [style.display]="showModal ? 'block' : 'none'" tabindex="-1" aria-labelledby="datosModalLabel" aria-hidden="true">

  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header" id="modalHeader">
        <h5 class="modal-title">Información</h5>
        <button type="button" class="btn-close" (click)="cerrarModal()"></button>
      </div>

      <div class="modal-body">
        <div *ngIf="isLoading" class="spinner-container">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Cargando...</span>
          </div>
        </div>
        <table class="table" *ngIf="!isLoading && modalInfo.length > 0; else sinDatos">
          <tbody>
            <tr *ngFor="let dato of modalInfo" [ngClass]="{'section-title': dato.isTitle}">
              <th *ngIf="dato.isTitle" colspan="2">
                {{ dato.key }}
              </th>
              <ng-container *ngIf="!dato.isTitle">
                <td class="table-key">{{ dato.key }}</td>
                <td class="table-value" [ngClass]="{'long-text': dato.key === 'Ríos dentro del Municipio:'}">
                  <span *ngIf="dato.color" class="color-box" [ngStyle]="{'background-color': dato.color}"></span>
                  {{ dato.value }}
                </td>
              </ng-container>
            </tr>
          </tbody>
        </table>
        <ng-template #sinDatos>
          <p class="no-data-message" *ngIf="!isLoading">Área sin información.</p>
        </ng-template>
      </div>
    </div>
  </div>
</div>
<div id="sidebar-right" class="sidebar-right" [class.open]="sidebarOpen" [ngClass]="{'dark-theme': isDarkMode}"
  (mouseover)="disableMapInteractions()" (mouseleave)="enableMapInteractions()">
  <div class="sidebar-header">
    <h5>Gráfico General</h5>
    <button class="btn-close" (click)="toggleSidebar()" title="Cerrar Panel">
      <i class="bi bi-x"></i>
    </button>
  </div>
  <div class="sidebar-content">
    <div *ngIf="layerInfo">
      <p><strong>Nombre de la Capa:</strong> {{ layerInfo.nombre }}</p>
    </div>
    <div class="chart-container">
      <div class="spinner-container" *ngIf="isLoading">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
      </div>
      <canvas id="pieChart" [hidden]="isLoading"></canvas>
    </div>
    <div class="chart-legend" *ngIf="layerData.length > 0">
      <div *ngFor="let item of layerData" class="legend-item">
        <span class="legend-color" [style.background]="item.color"></span>
        <span>{{ item.label }}: {{ item.value }}%</span>
      </div>
    </div>
  </div>
</div>
<button *ngIf="isAnyLayerActive()" id="toggle-sidebar-btn" class="toggle-sidebar-btn" (click)="toggleSidebar()"
  [ngClass]="{'dark-theme': isDarkMode}">
  📊 Gráficos
</button>
